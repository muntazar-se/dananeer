<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="dananir-maskable-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F265B" />
      <stop offset="50%" stop-color="#3E1F47" />
      <stop offset="100%" stop-color="#220B2B" />
    </linearGradient>
    <linearGradient id="dananir-maskable-mark" x1="120" y1="100" x2="380" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#E9E0F0" />
      <stop offset="100%" stop-color="#B894D3" />
    </linearGradient>
    <filter id="pwa-maskable-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Full Bleed Background for Adaptive OS Masking (Circle / Squircle / Rounded Rect) -->
  <rect width="512" height="512" fill="url(#dananir-maskable-bg)" />

  <!-- Safe Zone Guide Center: Artwork scaled to 260px (within the 80% 409px Safe Zone circle) -->
  <g transform="translate(126, 126) scale(2.1666)" filter="url(#pwa-maskable-shadow)">
    <!-- Base Shadow Arch -->
    <path d="M 78 24 C 98 38, 102 68, 88 88 C 76 102, 54 104, 34 100 L 22 98 C 42 100, 68 98, 80 84 C 92 68, 88 44, 70 32 Z" fill="#9C7BB5" opacity="0.6" />
    <!-- Main Dal Arch -->
    <path d="M 72 26 C 90 38, 94 64, 82 82 C 72 96, 50 98, 30 96 C 46 96, 68 93, 76 80 C 86 64, 82 42, 66 32 C 54 24, 38 28, 28 38 C 22 44, 18 52, 18 62 C 18 80, 32 94, 52 94 L 52 86 C 36 86, 26 74, 26 62 C 26 54, 30 48, 34 44 C 42 36, 56 32, 66 38 Z" fill="url(#dananir-maskable-mark)" />
    <!-- Pivot Center Dinars Dot -->
    <circle cx="46" cy="62" r="9" fill="#FFFFFF" />
    <!-- Horizontal Gateway Base -->
    <path d="M 24 96 H 92" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>
